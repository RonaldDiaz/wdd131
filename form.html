<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 - Dynamic Web Fundamentals | Product Review Form</title>
    <meta name="author" content="Ronald Diaz Zerpa">
    <meta name="description"
        content="A Product Review Form, designed to put in practice good form design principles and specific field requirements.">
    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/form.js" defer></script>
    <link rel="stylesheet" href="styles/form.css">
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form action="review.html" method="get">
            <label for="product-select" class="field-title">Product Name
                <select name="product-select" id="product-select" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </label>
            <fieldset class="stars">
                <legend class="field-title">Overall Rating</legend>
                <input type="radio" id="fivestar" name="stars" value="5" required>
                <label for="fivestar"></label>
                <input type="radio" id="fourstar" name="stars" value="4" required>
                <label for="fourstar"></label>
                <input type="radio" id="threestar" name="stars" value="3" required>
                <label for="threestar"></label>
                <input type="radio" id="twostar" name="stars" value="2" required>
                <label for="twostar"></label>
                <input type="radio" id="onestar" name="stars" value="1" required>
                <label for="onestar"></label>
            </fieldset>
            <label for="installDate" class="field-title">Date of Installation<input type="date" id="installDate"
                    name="installDate" required></label>
            <fieldset class="features">
                <legend class="field-title">Which features did you find useful in the product? (Check all that apply)
                </legend>
                <label for="durability"><input type="checkbox" id="durability" name="features"
                        value="yes">Durability</label>
                <label for="easy"><input type="checkbox" id="easy" name="features" value="yes">Ease of Use</label>
                <label for="performance"><input type="checkbox" id="performance" name="features"
                        value="yes">Performance</label>
                <label for="design"><input type="checkbox" id="design" name="features" value="yes">Design</label>
            </fieldset>
            <label for="review" class="field-title">Written Review <span class="optional">(Optional)</span>
                <textarea id="review" name="review"></textarea>
            </label>
            <label for="username" class="field-title">Your Name <span class="optional">(Optional)</span>
                <input type="text" id="username" name="username">
            </label>
            <input type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <p>&copy; <span id="currentYear"></span> Ronald Diaz Zerpa - ☀️ Maracaibo, Venezuela ☀️</p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>
</body>

</html>
